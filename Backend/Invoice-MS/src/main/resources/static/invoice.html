<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Invoice</title>

  <style>
    body {
        font-family: Arial, sans-serif;
        font-size: 12px;
        color: #1E293B;
        margin: 40px;
    }

    /* Header */
    .header {
        width: 100%;
        border-bottom: 2px solid #2563EB;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    .header table {
        width: 100%;
    }

    .company-name {
        font-size: 18px;
        font-weight: bold;
    }

    .invoice-title {
        font-size: 26px;
        font-weight: bold;
        color: #2563EB;
        text-align: right;
    }

    /* Meta */
    .meta {
        width: 100%;
        margin-bottom: 20px;
    }

    .meta table {
        width: 100%;
    }

    .meta-left, .meta-right {
        vertical-align: top;
    }

    .meta-right {
        text-align: right;
    }

    .label {
        font-size: 10px;
        color: #64748B;
        font-weight: bold;
    }

    .value {
        font-size: 12px;
        margin-bottom: 5px;
    }

    .badge {
        display: inline-block;
        background: #EFF6FF;
        color: #2563EB;
        padding: 3px 10px;
        font-weight: bold;
    }

    /* Table */
    .items {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    .items th {
        background: #2563EB;
        color: white;
        padding: 8px;
        font-size: 11px;
        text-align: left;
    }

    .items td {
        padding: 8px;
        border-bottom: 1px solid #E2E8F0;
    }

    .right {
        text-align: right;
    }

    /* Totals */
    .totals {
        width: 100%;
        margin-top: 20px;
    }

    .totals table {
        width: 300px;
        margin-left: auto;
        border: 1px solid #E2E8F0;
    }

    .totals td {
        padding: 8px;
    }

    .totals .grand {
        background: #2563EB;
        color: white;
        font-weight: bold;
    }

    /* Notes */
    .notes {
        margin-top: 20px;
        padding: 10px;
        background: #F8FAFC;
        border-left: 3px solid #2563EB;
    }

    /* Footer */
    .footer {
        margin-top: 30px;
        border-top: 1px solid #E2E8F0;
        padding-top: 10px;
        font-size: 10px;
        color: #64748B;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <table>
    <tr>
      <td>
        <div class="company-name">ABC Fintech Pvt Ltd</div>
        <div>GSTIN: 07ABCDE1234F1Z5</div>
        <div>New Delhi, India</div>
      </td>
      <td class="invoice-title">
        INVOICE
      </td>
    </tr>
  </table>
</div>

<!-- META -->
<div class="meta">
  <table>
    <tr>
      <td class="meta-left">
        <div class="label">Billed To</div>
        <div class="value" th:text="${invoice.customer != null ? invoice.customer.name : ''}"></div>
        <div class="value" th:text="${invoice.customer != null ? invoice.customer.email : ''}"></div>
        <div class="value" th:text="${invoice.customer != null ? invoice.customer.phone : ''}"></div>
        <div class="value" th:text="${invoice.customer != null ? invoice.customer.address : ''}"></div>
      </td>

      <td class="meta-right">
        <div class="label">Invoice Number</div>
        <div class="badge" th:text="${invoice.invoiceNumber}">INV-001</div>

        <div class="label">Issue Date</div>
        <div class="value" th:text="${invoice.issueDate}"></div>

        <div class="label">Due Date</div>
        <div class="value" th:text="${invoice.dueDate}"></div>
      </td>
    </tr>
  </table>
</div>

<!-- ITEMS -->
<table class="items">
  <thead>
  <tr>
    <th>Item</th>
    <th>Description</th>
    <th class="right">Qty</th>
    <th class="right">Price</th>
    <th class="right">Tax %</th>
    <th class="right">Amount</th>
  </tr>
  </thead>

  <tbody>
  <tr th:if="${invoice.items == null or #lists.isEmpty(invoice.items)}">
    <td colspan="6">No items</td>
  </tr>

  <tr th:each="item : ${invoice.items}">
    <td th:text="${item.itemName}"></td>
    <td th:text="${item.description}"></td>
    <td class="right" th:text="${item.quantity}"></td>
    <td class="right" th:text="'Rs. ' + ${#numbers.formatDecimal(item.unitPrice,1,2)}"></td>
    <td class="right" th:text="${item.taxRate}"></td>
    <td class="right" th:text="'Rs. ' + ${#numbers.formatDecimal(item.totalPrice,1,2)}"></td>
  </tr>
  </tbody>
</table>

<!-- TOTALS -->
<div class="totals">
  <table>
    <tr>
      <td>Subtotal</td>
      <td class="right" th:text="'Rs. ' + ${#numbers.formatDecimal(invoice.subtotal,1,2)}"></td>
    </tr>
    <tr>
      <td>Tax</td>
      <td class="right" th:text="'Rs. ' + ${#numbers.formatDecimal(invoice.taxAmount,1,2)}"></td>
    </tr>
    <tr>
      <td>Discount</td>
      <td class="right" th:text="'Rs. ' + ${#numbers.formatDecimal(invoice.discount != null ? invoice.discount : 0,1,2)}"></td>
    </tr>
    <tr class="grand">
      <td>Total</td>
      <td class="right" th:text="'Rs. ' + ${#numbers.formatDecimal(invoice.totalAmount,1,2)}"></td>
    </tr>
  </table>
</div>

<!-- NOTES -->
<div class="notes" th:if="${invoice.notes != null}">
  <strong>Notes:</strong>
  <span th:text="${invoice.notes}"></span>
</div>

<!-- FOOTER -->
<div class="footer">
  Thank you for your business &#160;|&#160; Computer-generated invoice
</div>

</body>
</html>
